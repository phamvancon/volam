                        line3: { stat: 'Thể lực', val: 70, unit: 'đ' }
                    };
                } else {
                    newItems[slot.id] = {
                        name: `Giày Hoàng Kim (${elemObj.name})`,
                        element: currentElem,
                        baseStats: [{ stat: 'Tốc độ di chuyển', val: 42, unit: '%' }],
                        line1: { stat: 'Kháng Lôi (Thổ)', val: 32, unit: '%' },
                        line2: { stat: 'Sinh lực tối đa', val: 240, unit: 'đ' },
                        line3: { stat: 'Giảm suy yếu', val: 40, unit: 'đ' }
                    };
                }

                currentElem = elemObj.generates;
            });

            return newItems;
        };

        function App() {
            // Mặc định chọn Đường Môn (FACTIONS[2])
            const [selectedFaction, setSelectedFaction] = useState(FACTIONS[2]);
            const [userLevel, setUserLevel] = useState(90);
            const [items, setItems] = useState(() => generateFactionGearSet(FACTIONS[2]));
            const [activeTab, setActiveTab] = useState('sim'); // sim, chart_matrix, diagram, level_guide, ai_scan, cloud_saves, forge
            const [selectedPairWeaponElem, setSelectedPairWeaponElem] = useState('kim');
            const [editingSlot, setEditingSlot] = useState(null);
            const [shareCode, setShareCode] = useState('');
            const [showShareModal, setShowShareModal] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // Cloud Save States
            const [currentUser, setCurrentUser] = useState(null);
            const [cloudBuilds, setCloudBuilds] = useState([]);
            const [publicCloudBuilds, setPublicCloudBuilds] = useState([]);
            const [isCloudLoading, setIsCloudLoading] = useState(false);
            const [buildTitle, setBuildTitle] = useState('');

            // AI Scanner States
            const [uploadedImage, setUploadedImage] = useState(null);
            const [aiAnalysisResult, setAiAnalysisResult] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const fileInputRef = useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);

            // Tự động gán thuộc tính Ngũ Hành 10 món theo hệ Vũ Khí được chọn
            const applyWeaponElementSet = (weaponElem) => {
                const pairConfig = PAIR_CONFIGS[weaponElem];
                if (!pairConfig) return;
                const newItems = { ...items };
                pairConfig.pairs.forEach(p => {
                    if (newItems[p.slotId]) {
                        newItems[p.slotId] = {
                            ...newItems[p.slotId],
                            element: p.elem

                    }
                });
                setItems(newItems);
                setSelectedPairWeaponElem(weaponElem);
                showToast(`Đã tự động cập nhật đồng bộ 10 món trang bị theo Vũ Khí hệ ${ELEMENTS[weaponElem].name.toUpperCase()}!`);
            };

            const handleFactionSelect = (faction) => {
                setSelectedFaction(faction);
                const newItems = generateFactionGearSet(faction);
                setItems(newItems);
                showToast(`Đã tự động đổi Set Đồ & Vòng Kích Full 100% cho phái ${faction.name} (${ELEMENTS[faction.element].name})!`);
            };

            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.FirebaseSDK || !window.FirebaseAuth) return;
                    const { signInWithCustomToken, signInAnonymously, onAuthStateChanged } = window.FirebaseSDK;
                    const auth = window.FirebaseAuth;

                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.warn("Auth fallback to anonymous:", err);
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (usr) => {
                        setCurrentUser(usr);
                        if (usr) {
                            fetchUserCloudBuilds(usr.uid);
                            fetchPublicCloudBuilds();
                        }
                    });
                };

                initFirebase();
                window.addEventListener('firebase-ready', initFirebase);
                return () => window.removeEventListener('firebase-ready', initFirebase);
            }, []);

            const fetchUserCloudBuilds = (uid) => {
                if (!window.FirebaseDB || !window.FirebaseSDK || !uid) return;
                const { collection, onSnapshot } = window.FirebaseSDK;
                const db = window.FirebaseDB;
                const appId = window.FirebaseAppId;

                const userColRef = collection(db, 'artifacts', appId, 'users', uid, 'builds');
                onSnapshot(userColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    setCloudBuilds(list);
                }, (err) => console.error("Cloud fetch user build error:", err));
            };

            const fetchPublicCloudBuilds = () => {
                if (!window.FirebaseDB || !window.FirebaseSDK) return;
                const { collection, onSnapshot } = window.FirebaseSDK;
                const db = window.FirebaseDB;
                const appId = window.FirebaseAppId;

                const pubColRef = collection(db, 'artifacts', appId, 'public', 'data', 'community_builds');
                onSnapshot(pubColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    setPublicCloudBuilds(list);
                }, (err) => console.error("Cloud fetch public error:", err));
            };

            const handleSaveBuildToCloud = async (isPublic = false) => {
                if (!currentUser || !window.FirebaseDB || !window.FirebaseSDK) {
                    showToast("Đang kết nối dịch vụ Cloud...");
                    return;
                }
                setIsCloudLoading(true);
                const { collection, addDoc } = window.FirebaseSDK;
                const db = window.FirebaseDB;
                const appId = window.FirebaseAppId;

                const buildPayload = {
                    title: buildTitle || `Build ${selectedFaction.name} - Lv.${userLevel}`,
                    factionId: selectedFaction.id,
                    factionName: selectedFaction.name,
                    level: userLevel,
                    items: items,
                    updatedAt: new Date().toISOString(),
                    userId: currentUser.uid
                };

                try {
                    const userColRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'builds');
                    await addDoc(userColRef, buildPayload);

                    if (isPublic) {
                        const pubColRef = collection(db, 'artifacts', appId, 'public', 'data', 'community_builds');
                        await addDoc(pubColRef, buildPayload);
                    }

                    setBuildTitle('');
                    showToast("Đã lưu Build thành công lên Cloud Online!");
                } catch (err) {
                    console.error("Save Cloud Error:", err);
                    showToast("Lỗi khi lưu lên Cloud!");
                } finally {
                    setIsCloudLoading(false);
                }
            };

            const activationStatus = useMemo(() => {
                const status = {};
                const slotActivatorMap = {
                    weapon: 'armor',
                    head: 'necklace',
                    boots: 'weapon',
                    ring1: 'head',
                    gloves: 'boots',
                    pendant: 'ring1',
                    ring2: 'gloves',
                    belt: 'pendant',
                    armor: 'ring2',
                    necklace: 'belt'
                };

                SLOT_CHAIN.forEach(slot => {
                    const activatorSlotId = slotActivatorMap[slot.id];
                    const activatorItem = items[activatorSlotId];
                    const currentItem = items[slot.id];
                    if (activatorItem && currentItem) {
                        const actElement = ELEMENTS[activatorItem.element];
                        const isActivated = actElement.generates === currentItem.element;
                        status[slot.id] = {
                            isActivated,
                            activatedBySlot: activatorSlotId,
                            requiredElement: actElement.id
                        };
                    }
                });
                return status;
            }, [items]);

            const activatedCount = Object.values(activationStatus).filter(s => s.isActivated).length;
            const activationPercentage = Math.round((activatedCount / 10) * 100);

            const totalStats = useMemo(() => {
                const totals = {
                    khangTatCa: 0, khangKim: 0, khangMoc: 0, khangThuy: 0, khangHoa: 0, khangTho: 0,
                    hp: 0, mp: 0, tocDoDanh: 0, tocDoDiChuyen: 0, giamChoang: 0, giamDoc: 0, giamLamCham: 0,
                    chiMang: 0, stNgudHanh: 0, neTranh: 0
                };

                const parseAndAdd = (statName, val) => {
                    const name = statName.toLowerCase();
                    if (name.includes('kháng tất cả')) totals.khangTatCa += val;
                    else if (name.includes('băng') || name.includes('thủy')) totals.khangThuy += val;
                    else if (name.includes('lôi') || name.includes('thổ')) totals.khangTho += val;
                    else if (name.includes('độc') || name.includes('mộc')) totals.khangMoc += val;
                    else if (name.includes('hỏa')) totals.khangHoa += val;
                    else if (name.includes('kim') || name.includes('vật lý phòng')) totals.khangKim += val;
                    else if (name.includes('sinh khí') || name.includes('sinh lực')) totals.hp += val;
                    else if (name.includes('nội lực')) totals.mp += val;
                    else if (name.includes('tốc độ đánh')) totals.tocDoDanh += val;
                    else if (name.includes('tốc độ di chuyển')) totals.tocDoDiChuyen += val;
                    else if (name.includes('choáng')) totals.giamChoang += val;
                    else if (name.includes('trúng độc')) totals.giamDoc += val;
                    else if (name.includes('làm chậm')) totals.giamLamCham += val;
                    else if (name.includes('chí mạng')) totals.chiMang += val;
                    else if (name.includes('sát thương') || name.includes('ngũ hành')) totals.stNgudHanh += val;
                    else if (name.includes('né tránh')) totals.neTranh += val;
                };

                Object.keys(items).forEach(slotId => {
                    const item = items[slotId];
                    const isAct = activationStatus[slotId]?.isActivated;
                    item.baseStats.forEach(bs => parseAndAdd(bs.stat, Number(bs.val) || 0));
                    if (isAct) {
                        if (item.line1) parseAndAdd(item.line1.stat, Number(item.line1.val) || 0);
                        if (item.line2) parseAndAdd(item.line2.stat, Number(item.line2.val) || 0);
                        if (item.line3) parseAndAdd(item.line3.stat, Number(item.line3.val) || 0);
                    }
                });

                return totals;
            }, [items, activationStatus]);

            const evaluation = useMemo(() => {
                const avgKhang = totalStats.khangTatCa + Math.round((totalStats.khangKim + totalStats.khangMoc + totalStats.khangThuy + totalStats.khangHoa + totalStats.khangTho) / 5);
                const ehp = Math.round(totalStats.hp * (1 + (avgKhang / 100)));
                const score = Math.round(
                    (totalStats.hp * 1.5) + (avgKhang * 120) + (totalStats.tocDoDanh * 80) +
                    (totalStats.tocDoDiChuyen * 50) + (totalStats.stNgudHanh * 60) + (activatedCount * 500)
                );
                return { ehp, score };
            }, [totalStats, activatedCount]);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onloadend = () => {
                    setUploadedImage(reader.result);
                    analyzeEquipmentImage(reader.result);
                };
                reader.readAsDataURL(file);
            };

            const analyzeEquipmentImage = async (base64Img) => {
                setIsAnalyzing(true);
                setAiAnalysisResult('');

                try {
                    const base64Data = base64Img.split(',')[1];
                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const prompt = `Bạn là một game thủ Võ Lâm Truyền Kỳ / Tân Võ Lâm chuyên nghiệp. Hãy soi và phân tích bức ảnh chụp trang bị này:
1. Tên món đồ, Phẩm chất, Hệ Ngũ Hành.
2. Danh sách Dòng Hiện (Trắng) và Dòng Ẩn (Ngũ Hành).
3. Đánh giá Dòng ngon (VIP) vs Dòng rác.
4. Môn Phái nào dùng tốt nhất?
5. Gợi ý Khảm Đá / Cường Hóa nâng cấp tối ưu.
Viết ngắn gọn, chuyên nghiệp, dùng thuật ngữ game thủ Võ Lâm!`;

                    const payload = {
                        contents: [{
                            role: "user",
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: "image/png", data: base64Data } }
                            ]
                        }]
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const textResult = result.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (textResult) {
                        setAiAnalysisResult(textResult);
                    } else {
                        setAiAnalysisResult("Không thể đọc được dữ liệu từ hình ảnh. Hãy chắc chắn ảnh chụp rõ tên và thuộc tính trang bị!");
                    }
                } catch (err) {
                    console.error("AI Scan Error:", err);
                    setAiAnalysisResult("Đã xảy ra lỗi khi kết nối với Trợ lý AI Soi Đồ. Hãy thử lại!");
                } finally {
                    setIsAnalyzing(false);
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-6">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-amber-500 text-slate-950 font-black px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2 border border-yellow-300">
                            <i className="fa-solid fa-circle-check text-xl"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Header Banner */}
                    <header className="bg-panelbg border border-slate-800 rounded-3xl p-6 mb-6 shadow-2xl relative overflow-hidden">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative z-10">
                            <div>
                                <div className="flex items-center gap-2.5 mb-1.5">
                                    <span className="bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 text-xs font-black px-3 py-1 rounded-md uppercase tracking-wider shadow">
                                        V3.5 Ultimate Gigantic
                                    </span>
                                    <span className="text-xs text-slate-400 font-medium">Cloud Save & Gemini AI Advisor</span>
                                </div>
                                <h1 className="text-2xl md:text-3xl font-black text-amber-400 tracking-tight flex items-center gap-3">
                                    <i className="fa-solid fa-dragon text-amber-500"></i>
                                    <span>TÂN VÕ LÂM GIGANTIC - PHÂN TÍCH PHỐI ĐỒ NGŨ HÀNH</span>
                                </h1>
                                <p className="text-slate-400 text-xs md:text-sm mt-1">
                                    Môn phái ưu tiên mặc định: <strong className="text-emerald-400 font-bold">Đường Môn (Hệ Mộc)</strong> • Tự động kích full 10 món viên mãn!
                                </p>

                            <div className="flex flex-wrap items-center gap-3">
                                <button 
                                    onClick={() => handleFactionSelect(selectedFaction)}
                                    className="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2 text-xs border border-yellow-300">
                                    <i className="fa-solid fa-wand-magic-sparkles"></i>
                                    <span>Kích Full 100% Phái Này</span>
                                </button>
                                <button 
                                    onClick={() => setActiveTab('cloud_saves')}
                                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2 text-xs border border-emerald-400/30">
                                    <i className="fa-solid fa-cloud-arrow-up"></i>
                                    <span>Lưu Cloud Online</span>
                                </button>
                            </div>
                        </div>

                        {/* Thanh Chọn Nhanh 10 Môn Phái */}
                        <div className="mt-6 pt-5 border-t border-slate-800 flex flex-wrap items-center justify-between gap-4">

                    </header>

                    <div className="flex items-center gap-2 mb-6 overflow-x-auto pb-2">

                            }`}>

                            <i className="fa-solid fa-cloud"></i>

                            }`}>
                            <i className="fa-solid fa-hammer"></i>
                            <span>Bảng Cường Hóa</span>
                        </button>
                    </div>

                    {/* TAB BẢNG NGŨ HÀNH CẶP THEO ẢNH UPLOAD */}
                    {activeTab === 'chart_matrix' && (
                        <div className="space-y-6 max-w-5xl mx-auto">
                            <div className="bg-panelbg border border-amber-500/40 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-4 border-b border-slate-800">
                                    <div>
                                        <span className="bg-amber-500 text-slate-950 text-[10px] font-black px-2.5 py-1 rounded uppercase tracking-wider">
                                            Bản Kích Đồ Cặp Tương Sinh Chuẩn
                                        </span>
                                        <h2 className="text-xl font-black text-amber-400 uppercase tracking-tight mt-1 flex items-center gap-2">
                                            <i className="fa-solid fa-table"></i>
                                            <span>BẢNG KÍCH NGŨ HÀNH TƯƠNG ỨNG TỪ ẢNH UPLOAD</span>
                                        </h2>
                                        <p className="text-xs text-slate-300 mt-1">
                                            Sơ đồ kích ẩn theo cặp 2 món khép kín: Thổ ➔ Kim ➔ Thủy ➔ Mộc ➔ Hỏa ➔ Thổ.
                                        </p>
                                    </div>

                                    <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-xl border border-slate-800">
                                        <span className="text-xs font-bold text-amber-400">Chọn Vũ Khí:</span>
                                        {Object.keys(PAIR_CONFIGS).map(eKey => {
                                            const el = ELEMENTS[eKey];
                                            const isSelected = selectedPairWeaponElem === eKey;
                                            return (
                                                <button
                                                    key={eKey}
                                                    onClick={() => setSelectedPairWeaponElem(eKey)}
                                                    className={`px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 border ${
                                                        isSelected ? `${el.bg} ${el.class} border-amber-400 ring-1 ring-amber-400 shadow-md` : 'bg-slate-900 text-slate-400 border-slate-800'
                                                    }`}
                                                >
                                                    <i className={`fa-solid ${el.icon}`}></i>
                                                    <span>{el.name}</span>

                                    </div>

                                            <span className="text-slate-400">Thân Pháp (TP):</span>
                                            <span className="font-bold text-white">{Math.round(userLevel * 2.0)} Điểm</span>
                                        </div>
                                        <div className="flex justify-between p-2 rounded bg-slate-900 border border-slate-800">
                                            <span className="text-slate-400">Sinh Khí (SK):</span>
                                            <span className="font-bold text-white">{Math.round(userLevel * 2.5)} Điểm</span>
                                        </div>
                                        <div className="flex justify-between p-2 rounded bg-slate-900 border border-slate-800">
                                            <span className="text-slate-400">Nội Lực (NL):</span>
                                            <span className="font-bold text-white">{Math.round(userLevel * 2.0)} Điểm</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-3">
                                    <h3 className="text-xs font-bold text-purple-400 uppercase tracking-wider flex items-center gap-2">
                                        <i className="fa-solid fa-trophy"></i>
                                        <span>Cột Mốc Mục Tiêu Đồ Theo Cấp</span>
                                    </h3>
                                    <div className="space-y-2 text-xs">
                                        <div className={`p-2.5 rounded-xl border ${userLevel >= 30 ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>
                                            <strong>• Lv.30 - Lv.60:</strong> Đồ Xanh 3-4 Dòng + Set An Bang Sơ Cấp.
                                        </div>
                                        <div className={`p-2.5 rounded-xl border ${userLevel >= 90 ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>
                                            <strong>• Lv.90 - Lv.120:</strong> Vũ Khí Hoàng Kim + Full Set An Bang / Định Quốc 100% Kích Ẩn.
                                        </div>
                                        <div className={`p-2.5 rounded-xl border ${userLevel >= 150 ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>
                                            <strong>• Lv.150+:</strong> Đồ Xanh 6 Dòng Max Option + Set Nhu Tình / Hiệp Cốt + Đập Đá +16.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'ai_scan' && (
                        <div className="bg-panelbg border border-slate-800 rounded-2xl p-6 shadow-2xl max-w-4xl mx-auto space-y-6">
                            <div className="text-center max-w-xl mx-auto">
                                <h2 className="text-xl font-black text-amber-400 uppercase tracking-tight flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-robot text-cyan-400"></i>
                                    <span>TRỢ LÝ GAME THỦ SOI ĐỒ AI</span>
                                </h2>
                                <p className="text-xs text-slate-400 mt-1">
                                    Tải ảnh chụp màn hình món đồ trong game lên. Gemini 3 Flash AI sẽ soi dòng, đánh giá Dòng VIP / Dòng Rác và chỉ bạn cách nâng cấp!
                                </p>
                            </div>

                            <div 
                                onClick={() => fileInputRef.current?.click()}
                                className="border-2 border-dashed border-slate-700 hover:border-amber-500/80 rounded-2xl p-8 text-center cursor-pointer bg-slate-950/60 hover:bg-slate-950/90 transition group">
                                <input 
                                    type="file" 
                                    accept="image/*" 
                                    ref={fileInputRef} 
                                    onChange={handleImageUpload} 
                                    className="hidden" 
                                />

                                {uploadedImage ? (
                                    <div className="flex flex-col items-center gap-3">
                                        <img src={uploadedImage} alt="Trang Bị Scan" className="max-h-60 rounded-xl border border-slate-700 shadow-xl" />
                                        <span className="text-xs text-emerald-400 font-bold">Nhấp vào đây để đổi ảnh khác</span>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        <div className="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-amber-400 text-2xl mx-auto group-hover:scale-110 transition">
                                            <i className="fa-solid fa-cloud-arrow-up"></i>
                                        </div>
                                        <div>
                                            <div className="text-sm font-bold text-white">Tải Ảnh Trang Bị Lên (PNG, JPG, WEBP)</div>
                                            <div className="text-xs text-slate-500 mt-1">Hoặc nhấp vào để chọn ảnh từ thư viện của bạn</div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {isAnalyzing && (
                                <div className="bg-slate-900/80 border border-cyan-500/40 p-6 rounded-2xl text-center space-y-3">
                                    <i className="fa-solid fa-spinner fa-spin text-3xl text-cyan-400"></i>
                                    <div className="text-xs font-bold text-cyan-300">Đang quét ảnh & soi dòng thuộc tính trang bị bằng AI Gemini...</div>
                                </div>
                            )}

                            {aiAnalysisResult && (
                                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
                                    <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                                        <h3 className="text-sm font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                                            <i className="fa-solid fa-scroll"></i>
                                            <span>KẾT QUẢ SOI ĐỒ CHI TIẾT TỪ AI</span>
                                        </h3>
                                        <span className="text-[10px] font-bold bg-emerald-950/80 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded">
                                            Gemini 3 Flash Powered
                                        </span>
                                    </div>

                                    <div className="text-xs text-slate-200 leading-relaxed font-sans whitespace-pre-line bg-slate-900/50 p-4 rounded-xl border border-slate-800/80">
                                        {aiAnalysisResult}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'cloud_saves' && (
                        <div className="bg-panelbg border border-slate-800 rounded-2xl p-6 shadow-2xl max-w-5xl mx-auto space-y-6">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-4 border-b border-slate-800">
                                <div>
                                    <h2 className="text-lg font-black text-emerald-400 uppercase tracking-tight flex items-center gap-2">
                                        <i className="fa-solid fa-cloud"></i>
                                        <span>KHO BUILD TRANG BỊ CLOUD ONLINE</span>
                                    </h2>
                                    <p className="text-xs text-slate-400 mt-1">
                                        Lưu trữ lâu dài dữ liệu build trên máy chủ Firebase. Truy cập từ bất kỳ thiết bị nào.
                                    </p>
                                </div>

                                <div className="flex items-center gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="Đặt tên cho Build..." 
                                        value={buildTitle}
                                        onChange={(e) => setBuildTitle(e.target.value)}
                                        className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-amber-300 focus:outline-none focus:border-amber-500"
                                    />
                                    <button 
                                        onClick={() => handleSaveBuildToCloud(true)}
                                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5">
                                        <i className="fa-solid fa-share"></i>
                                        <span>Lưu & Chia Sẻ Public</span>
                                    </button>
                                </div>
                            </div>

                            <div className="space-y-3">
                                <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                                    <i className="fa-solid fa-user-lock"></i>
                                    <span>Build Cá Nhân Trên Cloud ({cloudBuilds.length})</span>
                                </h3>

                                {cloudBuilds.length === 0 ? (
                                    <div className="bg-slate-950 p-6 rounded-xl border border-slate-800 text-center text-xs text-slate-500">
                                        Chưa có Build nào được lưu trên Cloud cá nhân. Hãy ấn "Lưu Cloud Online" ở góc trên!
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {cloudBuilds.map((b) => (
                                            <div key={b.id} className="bg-slate-950 border border-slate-800 hover:border-amber-500/50 p-4 rounded-xl space-y-2 transition">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xs font-bold text-amber-300">{b.title}</span>
                                                    <span className="text-[10px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded">{b.factionName} (Lv.{b.level})</span>
                                                </div>
                                                <div className="flex justify-between items-center pt-2 border-t border-slate-900">
                                                    <span className="text-[10px] text-slate-500">{new Date(b.updatedAt).toLocaleDateString('vi-VN')}</span>
                                                    <button 
                                                        onClick={() => {
                                                            setItems(b.items);
                                                            if (b.level) setUserLevel(b.level);
                                                            showToast(`Đã tải Build: ${b.title}!`);
                                                        }}
                                                        className="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-3 py-1 rounded-lg text-xs">
                                                        Tải Build
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="space-y-3 pt-4 border-t border-slate-800">
                                <h3 className="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                                    <i className="fa-solid fa-globe"></i>
                                    <span>Build Chia Sẻ Từ Cộng Đồng ({publicCloudBuilds.length})</span>
                                </h3>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {publicCloudBuilds.map((b) => (
                                        <div key={b.id} className="bg-slate-950 border border-slate-800 hover:border-cyan-500/50 p-4 rounded-xl space-y-2 transition">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-bold text-cyan-300">{b.title}</span>
                                                <span className="text-[10px] bg-cyan-950/60 text-cyan-400 px-2 py-0.5 rounded border border-cyan-800">{b.factionName}</span>
                                            </div>
                                            <div className="flex justify-between items-center pt-2 border-t border-slate-900">
                                                <span className="text-[10px] text-slate-500">Public Cloud Share</span>
                                                <button 
                                                    onClick={() => {
                                                        setItems(b.items);
                                                        if (b.level) setUserLevel(b.level);
                                                        showToast(`Đã áp dụng Build public: ${b.title}!`);
                                                    }}
                                                    className="bg-cyan-900/60 hover:bg-cyan-800 text-white font-bold px-3 py-1 rounded-lg text-xs border border-cyan-700">
                                                    Áp Dụng
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'forge' && (
                        <div className="bg-panelbg border border-slate-800 rounded-2xl p-6 shadow-2xl max-w-4xl mx-auto space-y-6">
                            <div className="text-center max-w-xl mx-auto">
                                <h2 className="text-xl font-black text-amber-400 uppercase tracking-tight flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-hammer"></i>
                                    <span>BẢNG CHI PHÍ CƯỜNG HÓA TỪ +1 ĐẾN +16</span>
                                </h2>
                                <p className="text-xs text-slate-400 mt-1">
                                    Tính toán số đá cường hóa, tỷ lệ thành công và lượng Vàng/Bạc cần chuẩn bị để đập đồ không lo xịt!
                                </p>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs border-collapse">
                                    <thead>
                                        <tr className="bg-slate-900 text-amber-400 border-b border-slate-800 font-bold uppercase">
                                            <th className="p-3">Mốc Cường Hóa</th>
                                            <th className="p-3">Huyền Tinh / Đá Cần</th>
                                            <th className="p-3">Tỷ Lệ Thành Công</th>
                                            <th className="p-3">Bạc Khóa Cần</th>
                                            <th className="p-3">Thuộc Tính Thêm</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/60 text-slate-300">
                                        {[
                                            { lvl: '+1 ➔ +4', stone: 'Huyền Tinh Cấp 1-3', rate: '100%', silver: '5,000 Bạc', bonus: '+10% Chỉ số cơ bản' },
                                            { lvl: '+5 ➔ +8', stone: 'Huyền Tinh Cấp 4-5', rate: '85% - 70%', silver: '25,000 Bạc', bonus: '+25% CS + Kích thuộc tính Mốc 1' },
                                            { lvl: '+9 ➔ +12', stone: 'Huyền Tinh Cấp 6-7', rate: '60% - 45%', silver: '100,000 Bạc', bonus: '+50% CS + Kích thuộc tính Mốc 2' },
                                            { lvl: '+13 ➔ +14', stone: 'Huyền Tinh Cấp 8', rate: '35%', silver: '500,000 Bạc', bonus: '+75% CS + Glow Hào Quang Phẩm Kim' },
                                            { lvl: '+15 ➔ +16', stone: 'Huyền Tinh Cấp 9-10', rate: '20%', silver: '2,000,000 Bạc', bonus: '+100% CS + Vòng Hào Quang Hoàng Kim Supreme' }
                                        ].map((row, idx) => (
                                            <tr key={idx} className="hover:bg-slate-900/40">
                                                <td className="p-3 font-extrabold text-amber-300">{row.lvl}</td>
                                                <td className="p-3">{row.stone}</td>
                                                <td className="p-3 font-bold text-emerald-400">{row.rate}</td>
                                                <td className="p-3">{row.silver}</td>
                                                <td className="p-3 text-cyan-300">{row.bonus}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* Modal Edit Trang Bị */}
                    {editingSlot && (
                        <ModalEditItem 
                            slot={SLOT_CHAIN.find(s => s.id === editingSlot)}
                            item={items[editingSlot]}
                            onClose={() => setEditingSlot(null)}
                            onApplyWeaponSet={applyWeaponElementSet}
                            onSave={(updated) => {
                                setItems(prev => ({ ...prev, [editingSlot]: updated }));
                                setEditingSlot(null);
                                showToast("Đã lưu cập nhật món đồ!");
                            }}
                        />
                    )}
                </div>
            );
        }

        function ModalEditItem({ slot, item, onClose, onSave, onApplyWeaponSet }) {
            const [formData, setFormData] = useState({ ...item });

            const handleBaseChange = (idx, field, value) => {
                const newBase = [...formData.baseStats];
                newBase[idx][field] = value;
                setFormData({ ...formData, baseStats: newBase });
            };

            const handleLineChange = (lineKey, field, value) => {
                setFormData({
                    ...formData,
                    [lineKey]: { ...formData[lineKey], [field]: value }
                });
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-panelbg border border-slate-700 rounded-2xl p-6 max-w-lg w-full shadow-2xl my-8">
                        <div className="flex justify-between items-center pb-3 mb-4 border-b border-slate-800">
                            <h3 className="text-base font-bold text-amber-400 flex items-center gap-2">
                                <i className={`fa-solid ${slot.icon}`}></i>
                                <span>Sửa Món: {slot.name}</span>
                            </h3>
                            <button onClick={onClose} className="text-slate-400 text-lg"><i className="fa-solid fa-xmark"></i></button>
                        </div>

                        <div className="space-y-4 text-xs">
                            <div>
                                <label className="block text-slate-400 mb-1 font-bold">Tên Món Đồ:</label>
                                <input 
                                    type="text" 
                                    value={formData.name}
                                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white font-semibold"
                                />
                            </div>

                            <div>
                                <div className="flex items-center justify-between mb-1">
                                    <label className="text-slate-400 font-bold">Hệ Ngũ Hành:</label>
                                    {slot.id === 'weapon' && (
                                        <span className="text-[10px] text-amber-400 italic">Mẹo: Chọn hệ vũ khí để kích hoạt cả bộ</span>
                                    )}
                                </div>
                                <div className="grid grid-cols-5 gap-1.5">
                                    {Object.keys(ELEMENTS).map(eKey => {
                                        const el = ELEMENTS[eKey];
                                        const isSel = formData.element === eKey;
                                        return (
                                            <button
                                                key={eKey}
                                                type="button"
                                                onClick={() => {
                                                    setFormData({ ...formData, element: eKey });
                                                    if (slot.id === 'weapon' && onApplyWeaponSet) {
                                                        onApplyWeaponSet(eKey);
                                                    }
                                                }}
                                                className={`py-1.5 rounded font-bold transition flex items-center justify-center gap-1 border ${
                                                    isSel ? `${el.bg} ${el.class} border-current ring-1 ring-amber-400` : 'bg-slate-950 text-slate-400 border-slate-800'
                                                }`}
                                            >
                                                <span>{el.name}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="pt-2 border-t border-slate-800">
                                <label className="block text-slate-400 mb-2 font-bold">Dòng Hiện (Cơ Bản):</label>
                                {formData.baseStats.map((bs, idx) => (
                                    <div key={idx} className="flex gap-2 mb-2">
                                        <input 
                                            type="text" value={bs.stat} onChange={(e) => handleBaseChange(idx, 'stat', e.target.value)}
                                            className="flex-1 bg-slate-950 border border-slate-800 rounded p-2 text-slate-200"
                                        />
                                        <input 
                                            type="number" value={bs.val} onChange={(e) => handleBaseChange(idx, 'val', Number(e.target.value))}
                                            className="w-20 bg-slate-950 border border-slate-800 rounded p-2 text-slate-200"
                                        />
                                        <input 
                                            type="text" value={bs.unit} onChange={(e) => handleBaseChange(idx, 'unit', e.target.value)}
                                            className="w-16 bg-slate-950 border border-slate-800 rounded p-2 text-slate-200"
                                        />
                                    </div>
                                ))}
                            </div>

                            <div className="pt-2 border-t border-slate-800">
                                <label className="block text-amber-400 mb-2 font-bold">3 Dòng Ẩn Ngũ Hành:</label>
                                {['line1', 'line2', 'line3'].map((lineKey, lIdx) => (
                                    <div key={lineKey} className="flex gap-2 mb-2 items-center">
                                        <span className="text-slate-500 font-bold w-12">Ẩn {lIdx+1}:</span>
                                        <input 
                                            type="text" value={formData[lineKey]?.stat || ''} onChange={(e) => handleLineChange(lineKey, 'stat', e.target.value)}
                                            className="flex-1 bg-slate-950 border border-slate-800 rounded p-2 text-amber-300"
                                        />
                                        <input 
                                            type="number" value={formData[lineKey]?.val || 0} onChange={(e) => handleLineChange(lineKey, 'val', Number(e.target.value))}
                                            className="w-20 bg-slate-950 border border-slate-800 rounded p-2 text-amber-300"
                                        />
                                        <input 
                                            type="text" value={formData[lineKey]?.unit || ''} onChange={(e) => handleLineChange(lineKey, 'unit', e.target.value)}
                                            className="w-16 bg-slate-950 border border-slate-800 rounded p-2 text-amber-300"
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-end gap-2 mt-5 pt-3 border-t border-slate-800">
                            <button onClick={onClose} className="bg-slate-800 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">Hủy</button>
                            <button onClick={() => onSave(formData)} className="bg-amber-500 text-slate-950 font-black px-5 py-2 rounded-xl text-xs">Lưu Món Đồ</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
