            const [activeTab, setActiveTab] = useState('sim'); // sim, level_guide, ai_scan, cloud_saves, forge, factions
            const [editingSlot, setEditingSlot] = useState(null);
            const [shareCode, setShareCode] = useState('');
            const [showShareModal, setShowShareModal] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // Cloud Save States
            const [currentUser, setCurrentUser] = useState(null);
            const [cloudBuilds, setCloudBuilds] = useState([]);
            const [publicCloudBuilds, setPublicCloudBuilds] = useState([]);
            const [isCloudLoading, setIsCloudLoading] = useState(false);
            const [buildTitle, setBuildTitle] = useState('');

            // AI Scanner States
            const [uploadedImage, setUploadedImage] = useState(null);
            const [aiAnalysisResult, setAiAnalysisResult] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const fileInputRef = useRef(null);

            // Toast Notifier
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.FirebaseSDK || !window.FirebaseAuth) return;
                    const { signInWithCustomToken, signInAnonymously, onAuthStateChanged } = window.FirebaseSDK;
                    const auth = window.FirebaseAuth;

                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.warn("Auth token failed, fallback to anonymous:", err);
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (usr) => {
                        setCurrentUser(usr);
                        if (usr) {
                            fetchUserCloudBuilds(usr.uid);
                            fetchPublicCloudBuilds();
                        }
                    });
                };

                initFirebase();
                window.addEventListener('firebase-ready', initFirebase);
                return () => window.removeEventListener('firebase-ready', initFirebase);
            }, []);

            // Lấy danh sách Build Cloud của User
            const fetchUserCloudBuilds = (uid) => {
                if (!window.FirebaseDB || !window.FirebaseSDK || !uid) return;
                const { collection, onSnapshot } = window.FirebaseSDK;
                const db = window.FirebaseDB;
                const appId = window.FirebaseAppId;

                const userColRef = collection(db, 'artifacts', appId, 'users', uid, 'builds');
                onSnapshot(userColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    setCloudBuilds(list);
                }, (err) => console.error("Cloud fetch user build error:", err));
            };

            // Lấy danh sách Build Public từ Cộng Đồng
            const fetchPublicCloudBuilds = () => {
                if (!window.FirebaseDB || !window.FirebaseSDK) return;
                const { collection, onSnapshot } = window.FirebaseSDK;
                const db = window.FirebaseDB;
                const appId = window.FirebaseAppId;

                const pubColRef = collection(db, 'artifacts', appId, 'public', 'data', 'community_builds');
                onSnapshot(pubColRef, (snapshot) => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    setPublicCloudBuilds(list);
                }, (err) => console.error("Cloud fetch public error:", err));
            };

            // Lưu Build Hiện Tại Lên Cloud
            const handleSaveBuildToCloud = async (isPublic = false) => {
                if (!currentUser || !window.FirebaseDB || !window.FirebaseSDK) {
                    showToast("Đang kết nối dịch vụ Cloud...");
                    return;
                }
                setIsCloudLoading(true);
                const { collection, addDoc } = window.FirebaseSDK;
                const db = window.FirebaseDB;
                const appId = window.FirebaseAppId;

                const buildPayload = {
                    title: buildTitle || `Build ${selectedFaction.name} - Lv.${userLevel}`,
                    factionId: selectedFaction.id,
                    factionName: selectedFaction.name,
                    level: userLevel,
                    items: items,
                    updatedAt: new Date().toISOString(),
                    userId: currentUser.uid
                };

                try {
                    // Save Private
                    const userColRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'builds');
                    await addDoc(userColRef, buildPayload);

                    if (isPublic) {
                        const pubColRef = collection(db, 'artifacts', appId, 'public', 'data', 'community_builds');
                        await addDoc(pubColRef, buildPayload);
                    }

                    setBuildTitle('');
                    showToast("Đã lưu Build thành công lên Cloud Online!");
                } catch (err) {
                    console.error("Save Cloud Error:", err);
                    showToast("Lỗi khi lưu lên Cloud!");
                } finally {
                    setIsCloudLoading(false);
                }
            };

            const activationStatus = useMemo(() => {
                const status = {};
                SLOT_CHAIN.forEach(slot => {
                    const activatorSlotConfig = SLOT_CHAIN.find(s => s.activatesSlot === slot.id);
                    if (activatorSlotConfig) {
                        const activatorItem = items[activatorSlotConfig.id];
                        const currentItem = items[slot.id];
                        if (activatorItem && currentItem) {
                            const actElement = ELEMENTS[activatorItem.element];
                            const isActivated = actElement.generates === currentItem.element;
                            status[slot.id] = {
                                isActivated,
                                activatedBySlot: activatorSlotConfig.id,
                                requiredElement: actElement.id
                            };
                        }
                    }
                });
                return status;
            }, [items]);

            const activatedCount = Object.values(activationStatus).filter(s => s.isActivated).length;
            const activationPercentage = Math.round((activatedCount / 10) * 100);

            // Tổng Thuộc Tính Chi Tiết
            const totalStats = useMemo(() => {
                const totals = {
                    khangTatCa: 0, khangKim: 0, khangMoc: 0, khangThuy: 0, khangHoa: 0, khangTho: 0,
                    hp: 0, mp: 0, tocDoDanh: 0, tocDoDiChuyen: 0, giamChoang: 0, giamDoc: 0, giamLamCham: 0,
                    chiMang: 0, stNgudHanh: 0, neTranh: 0
                };

                const parseAndAdd = (statName, val) => {
                    const name = statName.toLowerCase();
                    if (name.includes('kháng tất cả')) totals.khangTatCa += val;
                    else if (name.includes('băng') || name.includes('thủy')) totals.khangThuy += val;
                    else if (name.includes('lôi') || name.includes('thổ')) totals.khangTho += val;
                    else if (name.includes('độc') || name.includes('mộc')) totals.khangMoc += val;
                    else if (name.includes('hỏa')) totals.khangHoa += val;
                    else if (name.includes('kim') || name.includes('vật lý phòng')) totals.khangKim += val;
                    else if (name.includes('sinh khí') || name.includes('sinh lực')) totals.hp += val;
                    else if (name.includes('nội lực')) totals.mp += val;
                    else if (name.includes('tốc độ đánh')) totals.tocDoDanh += val;
                    else if (name.includes('tốc độ di chuyển')) totals.tocDoDiChuyen += val;
                    else if (name.includes('choáng')) totals.giamChoang += val;
                    else if (name.includes('trúng độc')) totals.giamDoc += val;
                    else if (name.includes('làm chậm')) totals.giamLamCham += val;
                    else if (name.includes('chí mạng')) totals.chiMang += val;
                    else if (name.includes('sát thương ngũ') || name.includes('ngũ hành')) totals.stNgudHanh += val;
                    else if (name.includes('né tránh')) totals.neTranh += val;
                };

                Object.keys(items).forEach(slotId => {
                    const item = items[slotId];
                    const isAct = activationStatus[slotId]?.isActivated;
                    item.baseStats.forEach(bs => parseAndAdd(bs.stat, Number(bs.val) || 0));
                    if (isAct) {
                        if (item.line1) parseAndAdd(item.line1.stat, Number(item.line1.val) || 0);
                        if (item.line2) parseAndAdd(item.line2.stat, Number(item.line2.val) || 0);
                        if (item.line3) parseAndAdd(item.line3.stat, Number(item.line3.val) || 0);
                    }
                });

                return totals;

                const ehp = Math.round((totalStats.hp + (userLevel * 25)) * (1 + (avgKhang / 100)));
                const score = Math.round(
                    (totalStats.hp * 1.5) + 
                    (avgKhang * 120) + 
                    (totalStats.tocDoDanh * 80) + 
                    (totalStats.tocDoDiChuyen * 50) + 
                    (totalStats.stNgudHanh * 60) + 
                    (activatedCount * 500) + 
                    (userLevel * 30)

                return { ehp, score };

            };

            const analyzeImageWithGemini = async (imageDataUrl) => {
                setIsAnalyzing(true);
                setAiAnalysisResult('');

                try {
                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                    
                    const base64Data = imageDataUrl.replace(/^data:image\/(png|jpeg|jpg|webp);base64,/, "");

                    const systemPrompt = `Bạn là một Chuyên Gia Game Thủ Võ Lâm Truyền Kỳ am hiểu sâu sắc về hệ thống trang bị, kích ẩn Ngũ Hành, tẩy dòng và cường hóa. 
Hãy soi kỹ bức ảnh trang bị được cung cấp và đưa ra bản phân tích chi tiết bằng Tiếng Việt với cấu trúc chuẩn:
1. 🛡️ **Thông Tin Cơ Bản**: Tên trang bị, Hệ Ngũ Hành (Kim/Mộc/Thủy/Hỏa/Thổ), Phẩm cấp.
2. ⚡ **Đánh Giá Dòng Thuộc Tính**: Dòng Trắng ngon/cùi, Dòng Ẩn VIP / Dòng Rác cần tẩy.
3. 🔨 **Hướng Dẫn Cường Hóa & Khảm Đá**: Thứ tự ưu tiên lên mốc (+8, +12, +16) & đá khảm phù hợp.
4. 🐉 **Môn Phái Phù Hợp Nhất**: Đề xuất môn phái tận dụng 100% sức mạnh món đồ này.
5. 🏆 **Điểm Số Trang Bị**: Đánh giá trên thang điểm 100.`;

                    const payload = {
                        contents: [
                            {
                                role: "user",
                                parts: [
                                    { text: `Hãy soi và phân tích trang bị này cho môn phái ${selectedFaction.name} (Lv.${userLevel}).` },
                                    { inlineData: { mimeType: "image/png", data: base64Data } }
                                ]
                            }
                        ],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (text) {
                        setAiAnalysisResult(text);
                        showToast("AI đã soi đồ xong!");
                    } else {
                        throw new Error("Lỗi API response");
                    }
                } catch (err) {
                    console.error(err);
                    setAiAnalysisResult(`### ⚠️ Kết Quả Phân Tích Mẫu Trang Bị (Demo Offline Mode)
**1. Thông Tin**: Đao Hoàng Kim Kích Ẩn - Hệ Kim
**2. Đánh Giá Dòng**:
- Dòng 1: +98 Sát thương Ngũ Hành (Rất VIP)
- Dòng 2: +30% Tốc độ đánh (Tối quan trọng cho Thiếu Lâm / Thiên Vương)
- Dòng 3: +6% Hút Sinh Lực (Dòng Phụ Trợ Chuẩn)
**3. Cường Hóa**: Ưu tiên đập +12 để kích mốc Tốc Đánh.
**4. Phù Hợp**: Thiếu Lâm, Thiên Vương, Côn Lôn.
**5. Điểm Số**: 95 / 100.`);
                    showToast("Đã xuất bản phân tích mẫu!");
                } finally {
                    setIsAnalyzing(false);
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-6">

                    {toastMessage && (

                                    type="text" 
                                    value={formData.name}
                                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white font-semibold"
                                />
                            </div>

                            <div>
                                <label className="block text-slate-400 mb-1 font-bold">Hệ Ngũ Hành:</label>
                                <div className="grid grid-cols-5 gap-1.5">
                                    {Object.keys(ELEMENTS).map(eKey => {
                                        const el = ELEMENTS[eKey];
                                        const isSel = formData.element === eKey;
                                        return (
                                            <button
                                                key={eKey}
                                                type="button"
                                                onClick={() => setFormData({ ...formData, element: eKey })}
                                                className={`py-1.5 rounded font-bold transition flex items-center justify-center gap-1 border ${
                                                    isSel ? `${el.bg} ${el.class} border-current ring-1 ring-amber-400` : 'bg-slate-950 text-slate-400 border-slate-800'
                                                }`}
                                            >
                                                <span>{el.name}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="pt-2 border-t border-slate-800">
                                <label className="block text-slate-400 mb-2 font-bold">Dòng Hiện (Cơ Bản):</label>
                                {formData.baseStats.map((bs, idx) => (
                                    <div key={idx} className="flex gap-2 mb-2">
                                        <input 
                                            type="text" value={bs.stat} onChange={(e) => handleBaseChange(idx, 'stat', e.target.value)}
                                            className="flex-1 bg-slate-950 border border-slate-800 rounded p-2 text-slate-200"
                                        />
                                        <input 
                                            type="number" value={bs.val} onChange={(e) => handleBaseChange(idx, 'val', Number(e.target.value))}
                                            className="w-20 bg-slate-950 border border-slate-800 rounded p-2 text-slate-200"
                                        />
                                        <input 
                                            type="text" value={bs.unit} onChange={(e) => handleBaseChange(idx, 'unit', e.target.value)}
                                            className="w-16 bg-slate-950 border border-slate-800 rounded p-2 text-slate-200"
                                        />
                                    </div>
                                ))}
                            </div>

                            <div className="pt-2 border-t border-slate-800">
                                <label className="block text-amber-400 mb-2 font-bold">3 Dòng Ẩn Ngũ Hành:</label>
                                {['line1', 'line2', 'line3'].map((lineKey, lIdx) => (
                                    <div key={lineKey} className="flex gap-2 mb-2 items-center">
                                        <span className="text-slate-500 font-bold w-12">Ẩn {lIdx+1}:</span>
                                        <input 
                                            type="text" value={formData[lineKey]?.stat || ''} onChange={(e) => handleLineChange(lineKey, 'stat', e.target.value)}
                                            className="flex-1 bg-slate-950 border border-slate-800 rounded p-2 text-amber-300"
                                        />
                                        <input 
                                            type="number" value={formData[lineKey]?.val || 0} onChange={(e) => handleLineChange(lineKey, 'val', Number(e.target.value))}
                                            className="w-20 bg-slate-950 border border-slate-800 rounded p-2 text-amber-300"
                                        />
                                        <input 
                                            type="text" value={formData[lineKey]?.unit || ''} onChange={(e) => handleLineChange(lineKey, 'unit', e.target.value)}
                                            className="w-16 bg-slate-950 border border-slate-800 rounded p-2 text-amber-300"
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-end gap-2 mt-5 pt-3 border-t border-slate-800">
                            <button onClick={onClose} className="bg-slate-800 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">Hủy</button>
                            <button onClick={() => onSave(formData)} className="bg-amber-500 text-slate-950 font-black px-5 py-2 rounded-xl text-xs">Lưu Món Đồ</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
